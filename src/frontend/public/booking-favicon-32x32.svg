<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1683FF"/>
      <stop offset="100%" stop-color="#3938E8"/>
    </linearGradient>
  </defs>

  <!-- Rounded favicon background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Calendar -->
  <rect x="6.5" y="7.5" width="18" height="18" rx="3.2"
        fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Calendar top -->
  <path d="M6.8 12.5h17.4" stroke="white" stroke-width="2.5"/>

  <!-- Calendar binding rings -->
  <path d="M11 5.5v5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 5.5v5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Booking check -->
  <path d="M10.5 17.8l3.1 3.1 5.7-6"
        fill="none" stroke="white" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Business/store -->
  <path d="M19 20.5h7v5h-7z" fill="#1683FF" stroke="white" stroke-width="1.5"/>
  <path d="M18.3 20.5l1.1-2.7h6.2l1.1 2.7z"
        fill="#1683FF" stroke="white" stroke-width="1.5"
        stroke-linejoin="round"/>
  <path d="M21 25.5v-2.7h2v2.7" fill="none" stroke="white" stroke-width="1.2"/>
</svg>
