[project]
name = "meeting-scheduler-backend"
version = "0.1.0"
description = "Meeting Scheduler API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<2.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2.4,<3.0",
    "tzdata>=2026.1,<2027",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt,argon2]>=1.7,<2.0",
    "bcrypt>=4.0,<4.1",
    "phonenumbers>=9.0.37",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
