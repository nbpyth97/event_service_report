# --------------------------------------------------
# Host nginx config for the meeting-scheduler subdomain.
# Serves the built SPA from /var/www/meeting-scheduler and proxies /api/
# to the FastAPI container published on 127.0.0.1:8000.
#
# Host: meeting-scheduler.bakery-avenida.cloud
# Cert issued off-box via DNS-01 (not certbot --nginx) — copy
# fullchain.pem/privkey.pem to the paths below, then reload nginx.
# --------------------------------------------------

access_log /var/log/nginx/meeting-scheduler.access.log;
error_log  /var/log/nginx/meeting-scheduler.error.log warn;

limit_req_zone $binary_remote_addr zone=ms_login_limit:10m rate=5r/m;
# access_token_expire_minutes is 10 (core/config.py), so one legitimate tab
# refreshes ~6x/hour; the frontend's refreshInFlight singleton (auth.ts)
# already dedupes concurrent refreshes within a tab, but not across tabs —
# 10r/m covers a burst from several tabs whose tokens expire together.
limit_req_zone $binary_remote_addr zone=ms_refresh_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ms_api_limit:10m rate=60r/m;

server_tokens off;

upstream meeting_scheduler_backend {
    server 127.0.0.1:8020;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name meeting-scheduler.bakery-avenida.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meeting-scheduler.bakery-avenida.cloud;

    ssl_certificate /etc/letsencrypt/live/meeting-scheduler.bakery-avenida.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meeting-scheduler.bakery-avenida.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection deliberately omitted: modern browsers ignore it
    # (Chrome dropped the XSS Auditor years ago), and CSP below is the real
    # protection.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # style-src needs 'unsafe-inline': AdminCalendarGrid/StatusBreakdown set
    # computed style={{...}} props (position/width), not just static classes.
    # style-src/font-src also allow Google Fonts (Fraunces, loaded in index.html).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    # /docs, /redoc, /openapi.json need no block here: unreachable through
    # nginx (only /api/ is proxied) and unreachable directly (backend is
    # published loopback-only in docker-compose.yml).

    root /var/www/meeting-scheduler;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Anything that looks like a built static file (dist/assets/*, or a
    # future public/ file like favicon.ico) 404s for real instead of falling
    # through to the SPA shell above — try_files' /index.html fallback exists
    # for client-side routes, not for a missing/typo'd asset URL.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|webmanifest|woff2?|ttf|map|json|txt)$ {
        try_files $uri =404;
    }

    # ^~ : stop nginx from also checking the regex static-extension location
    # above for anything under here — without it, that regex (being a regex
    # location) would win over this plain prefix and silently skip the long
    # cache headers below for every /assets/*.css /*.js request.
    #
    # Any add_header here voids ALL add_header inherited from the server
    # block above for this location (nginx quirk — it's per-location
    # replacement, not merge) — hence the repeated security headers.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
    }

    # Country-flag SVGs (public/flags/, copied verbatim by Vite — see
    # CountryCodeSelect.tsx) — unlike /assets/*, these filenames are stable
    # across deploys (no content hash), so a shorter cache instead of
    # /assets/'s 1y+immutable: safe to cache aggressively since flags rarely
    # change, but a future edit to one shouldn't stay stale in browsers for a
    # full year. Needs ^~ for the same reason /assets/ does — otherwise the
    # regex static-extension location above (it also matches .svg) would win
    # and skip these headers entirely.
    location ^~ /flags/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
    }

    # SSE stream (useNotificationStream.ts) — disable buffering so events
    # flush immediately, and give it its own long read timeout instead of
    # the general API one below.
    location = /api/notifications/stream {
        proxy_pass http://meeting_scheduler_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # add_header Retry-After below voids the server block's inherited
    # add_headers for this location (same nginx quirk as /assets/ above) —
    # hence the repeated security headers here too.
    location = /api/auth/login {
        limit_req zone=ms_login_limit burst=5 nodelay;
        limit_req_status 429;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

        proxy_pass http://meeting_scheduler_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/refresh {
        limit_req zone=ms_refresh_limit burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://meeting_scheduler_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=ms_api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://meeting_scheduler_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
