limit_req_zone $binary_remote_addr zone=ms_login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ms_refresh_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ms_api_limit:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Hide the API docs in production — not needed by end users, and every
    # extra exposed surface is one more thing to keep patched.
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 444;
    }

    location = /api/auth/login {
        limit_req zone=ms_login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/auth/refresh {
        limit_req zone=ms_refresh_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=ms_api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/meeting-scheduler;
        try_files $uri $uri/ /index.html;
    }
}
